[package]
name = "sheet-port-core"
version = "2.2.1"
description = "Airtable - Sheet Port broker core: shared SQLite state, permission rules, pending changes, audit log, and table connectors."
authors = ["Airtable - Sheet Port"]
edition = "2021"
license = "MIT"

[features]
# Compiles the SQLite-backed MockConnector and its mock_data store, and
# registers it in ConnectorRegistry::with_default_connectors. Tests always
# have it; release builds leave it off.
mock = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
toml_edit = { workspace = true }

# Process lookups for the MCP card (sidecar parent process, verified sidecar
# stop, Claude Desktop detection). Already in the lock file through tauri and
# tokio, so this adds no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
