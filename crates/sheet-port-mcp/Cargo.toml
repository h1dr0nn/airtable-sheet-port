[package]
name = "sheet-port-mcp"
version = "2.0.0"
description = "Airtable - Sheet Port MCP sidecar: stdio server exposing the broker tools to AI agents."
authors = ["Airtable - Sheet Port"]
edition = "2021"

[[bin]]
name = "sheet-port-mcp"
path = "src/main.rs"

[features]
# Passes through to sheet-port-core: registers the SQLite-backed mock connector.
mock = ["sheet-port-core/mock"]

[dependencies]
sheet-port-core = { path = "../sheet-port-core" }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
# Optional loopback HTTP transport. rmcp's streamable-http server is a tower
# Service; hyper + hyper-util bind it to a TcpListener on 127.0.0.1 only.
hyper = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
# Tests (unit and tests/http_transport.rs) run against the mock connector, so
# `cargo test -p sheet-port-mcp` needs no --features flag. Release builds stay
# mock-free because dev-dependency features never reach `cargo build`.
sheet-port-core = { path = "../sheet-port-core", features = ["mock"] }
uuid = { workspace = true }
